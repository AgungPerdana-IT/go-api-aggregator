name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase repo
        run: echo "REPO=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        run: echo "SHA=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}:latest
            ghcr.io/${{ env.REPO }}:${{ env.SHA }}

      - name: SSH Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            docker pull ghcr.io/${{ env.REPO }}:${{ env.SHA }}
            docker stop aggregator || true
            docker rm aggregator || true
            docker run -d -p 3000:3000 \
              --env-file /root/go-api-aggregator/.env \
              --name aggregator \
              --restart unless-stopped \
              --memory="150m" \
              --memory-swap="150m" \
              --cpus="0.5" \
              --label version=${{ env.SHA }} \
              ghcr.io/${{ env.REPO }}:${{ env.SHA }}
            sleep 3
            docker ps | grep aggregator || echo "WARNING: Container not running!"
            docker image prune -a -f